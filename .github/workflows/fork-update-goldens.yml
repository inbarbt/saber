# Regenerates the screenshot goldens (the app-store screenshots the tests
# compare against) on GitHub's runner, after an intended change to how a
# screen looks, and commits them to the branch it runs on.
# The goldens only match on the same machine and fonts as the tests, so
# they can't be regenerated locally.
#
# Run by hand from the Actions tab, or with workflow_dispatch.

name: Update screenshot goldens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-goldens:
    name: Regenerate and commit goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: flutter pub get

      - name: Download Apple fonts
        run: dart run golden_screenshot:download_apple_fonts

      - name: Regenerate goldens
        run: flutter test --no-pub --update-goldens test/screenshot_goldens_test.dart

      - name: Commit changed goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A metadata test
          if git diff --cached --quiet; then
            echo "Goldens already up to date."
          else
            git commit -m "Update screenshot goldens [skip ci]"
            git push
          fi
